version: "3.9"

services:
  # ─── Frontend (Next.js) ───────────────────────────────────────────
  frontend:
    image: node:20-bookworm
    working_dir: /workspace/frontend
    command: sleep infinity
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace:cached
      - frontend_node_modules:/workspace/frontend/node_modules
    env_file: .env
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:5000
      - NEXT_PUBLIC_AI_ENGINE_URL=http://localhost:8000
    depends_on:
      - backend-api

  # ─── Backend API (.NET 8) ─────────────────────────────────────────
  backend-api:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /workspace
    command: sleep infinity
    ports:
      - "5000:5000"
      - "5001:5001"
    volumes:
      - .:/workspace:cached
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000;https://+:5001
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB:-aitravels};Username=${POSTGRES_USER:-aitravels};Password=${POSTGRES_PASSWORD:-devpassword}
    depends_on:
      db:
        condition: service_healthy

  # ─── AI Engine (Python / FastAPI) ─────────────────────────────────
  ai-engine:
    image: python:3.12-bookworm
    working_dir: /workspace/ai-engine
    command: sleep infinity
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace:cached
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://${POSTGRES_USER:-aitravels}:${POSTGRES_PASSWORD:-devpassword}@db:5432/${POSTGRES_DB:-aitravels}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
    depends_on:
      db:
        condition: service_healthy

  # ─── PostgreSQL 16 ────────────────────────────────────────────────
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    env_file: .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-aitravels}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-devpassword}
      - POSTGRES_DB=${POSTGRES_DB:-aitravels}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aitravels} -d ${POSTGRES_DB:-aitravels}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
    driver: local
  frontend_node_modules:
    driver: local
